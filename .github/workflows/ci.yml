name: Python Test CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: API and traditional pytest
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run pytest gate and generate reports
        shell: bash
        run: |
          mkdir -p reports/ci
          python -m pytest \
            test_api.py \
            test_observability.py \
            test_qa_tool.py \
            --cov=main \
            --cov-report=term-missing \
            --cov-report=xml:reports/ci/coverage.xml \
            --junitxml=reports/ci/junit.xml \
            --html=reports/ci/pytest-report.html \
            --self-contained-html \
            -q

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-reports
          path: reports/ci/
          if-no-files-found: ignore

  agent-offline:
    name: Agent offline regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 本任务不允许真实模型集成运行，也不下载模型权重。
      RUN_OLLAMA_INTEGRATION: '0'
      RUN_RAG_INTEGRATION: '0'
      HF_HUB_OFFLINE: '1'
      # 云端红色门禁已验证；关闭故障注入，使用正常预期验证恢复绿色。
      AGENT_GATE_DEMO: '0'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            .github/workflows/ci.yml

      - name: Install offline evaluation dependencies
        # 固定替身仍会导入Chroma类型，但不需要Sentence Transformers或Ollama。
        run: python -m pip install -r requirements.txt chromadb==1.5.9

      - name: Run Agent unit regression
        run: |
          mkdir -p reports/ci-agent
          python -m pytest test_agent_mvp.py test_agent_rag.py test_agent_ollama.py test_agent_evaluation.py \
            -m "not integration" -q \
            --junitxml=reports/ci-agent/junit.xml

      - name: Prepare isolated evaluation cases
        # 正式用例保持不变，只在报告目录生成本轮输入副本。
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          source = Path('eval_cases/agent_rag_v1.json')
          payload = json.loads(source.read_text(encoding='utf-8'))
          if os.environ.get('AGENT_GATE_DEMO') == '1':
              case = next(c for c in payload['cases'] if c['case_id'] == 'catalog-get-001')
              assert case['expected']['data']['data']['id'] == 101
              case['expected']['data']['data']['id'] = 102
              print('DEMO: catalog-get-001 expected id changed from 101 to 102')
          destination = Path('reports/ci-agent/input-cases.json')
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Require all versioned behavior cases to pass
        # 固定15条用例的任务通过率门槛为100%；不把工具成功率50%误判为失败。
        # 任意任务失败，现有CLI返回1，使本步骤和整个job失败。
        run: python agent_evaluation.py --planner offline --cases reports/ci-agent/input-cases.json --output-dir reports/ci-agent/evaluation

      - name: Upload Agent reports even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-offline-reports
          path: reports/ci-agent/
          if-no-files-found: ignore

  docker-delivery:
    name: Docker delivery and GHCR publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test, agent-offline]
    permissions:
      contents: read
      packages: write
    env:
      # 仅供一次性CI容器使用，不是生产Secret，也不写入镜像。
      APP_SECRET_KEY: ci-only-secret-key-at-least-32-characters
      APP_ADMIN_TOKEN: ci-only-admin-token
      IMAGE_NAME: ghcr.io/zedhan996/sdet-practise-api

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build runtime image
        run: docker compose build api

      - name: Verify runtime image boundary
        run: |
          docker run --rm --entrypoint python sdet-fastapi:local -c "from pathlib import Path; import importlib.util; assert not Path('/app/.env').exists(); assert not Path('/app/test_api.py').exists(); assert importlib.util.find_spec('pytest') is None; print('runtime image boundary: PASS')"

      - name: Run API tests inside test image
        run: docker compose --profile test run --build --rm api-tests

      - name: Start API container
        run: docker compose up -d api

      - name: Wait for health endpoint
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8001/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            echo "health check attempt ${attempt}/30 failed; retrying..."
            sleep 2
          done
          echo "health endpoint did not become ready within 60 seconds"
          exit 1

      - name: Verify deployed HTTP responses
        shell: bash
        run: |
          test "$(curl --fail --silent http://127.0.0.1:8001/health)" = '{"status":"ok","service":"sdet-fastapi"}'
          test "$(curl --fail --silent http://127.0.0.1:8001/)" = '{"message":"Hello, SDET!"}'

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          sha_tag="${IMAGE_NAME}:sha-${GITHUB_SHA}"
          latest_tag="${IMAGE_NAME}:latest"
          docker tag sdet-fastapi:local "${sha_tag}"
          docker tag sdet-fastapi:local "${latest_tag}"
          docker push "${sha_tag}"
          docker push "${latest_tag}"
          {
            echo "### Published container image"
            echo "- \`${sha_tag}\`"
            echo "- \`${latest_tag}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Show container evidence on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color api

      - name: Clean up CI containers
        if: always()
        run: docker compose down --volumes --remove-orphans
