[loggers]
keys=root,app.request,uvicorn,uvicorn.error,uvicorn.access

[handlers]
keys=default,access

[formatters]
keys=default,access

[logger_root]
level=INFO
handlers=default

[logger_app.request]
level=INFO
handlers=default
propagate=0
qualname=app.request

[logger_uvicorn]
level=INFO
handlers=default
propagate=0
qualname=uvicorn

[logger_uvicorn.error]
level=INFO
handlers=default
propagate=0
qualname=uvicorn.error

[logger_uvicorn.access]
level=INFO
handlers=access
propagate=0
qualname=uvicorn.access

[handler_default]
class=StreamHandler
args=(sys.stderr,)
formatter=default

[handler_access]
class=StreamHandler
args=(sys.stdout,)
formatter=access

[formatter_default]
class=uvicorn.logging.DefaultFormatter
format=%(asctime)s | %(levelprefix)s | %(name)s | %(message)s
datefmt=%Y-%m-%d %H:%M:%S

[formatter_access]
class=uvicorn.logging.AccessFormatter
format=%(asctime)s | %(levelprefix)s | %(client_addr)s - "%(request_line)s" %(status_code)s
datefmt=%Y-%m-%d %H:%M:%S
